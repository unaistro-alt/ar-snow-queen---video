<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js для A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="arjs-loader">Наведи камеру на Hiro</div>
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker preset="hiro">
        <a-entity
          gltf-model="#snowqween-mesh"
          scale="0.5 0.5 0.5"
          rotation="-90 0 0"
          position="0 0.5 0">
        </a-entity>
      </a-marker>

      <assets>
        <a-asset-item id="snowqween-mesh" src="SnowQween.glb"></a-asset-item>
      </assets>

      <!-- Добавила плоскость и небо: без них на мобильном часто белый экран -->
      <a-plane position="0 0 -2" rotation="-90 0 0" width="4" height="4" color="#777"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
