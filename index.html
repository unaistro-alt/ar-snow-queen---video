<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Snow Queen — hipo маркер</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false" embedded>

      <a-marker type="image" url="markers/hipo.png">
        <a-entity
          gltf-model="url(SnowQween.glb)"
          scale="0.5 0.5 0.5"
          rotation="-90 0 0">
        </a-entity>
      </a-marker>

    </a-scene>
  </body>
</html>
