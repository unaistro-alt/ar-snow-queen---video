<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-ar@0.7.1/build/aframe-ar.min.js"></script>

<a-scene arjs="sourceType: webcam; debugUIEnabled: false" embedded>
  <!-- Маркер hiro (hiro.png уже в репозитории, но AR.js использует preset) -->
  <a-marker type="pattern" url="preset://hiro">
    <!-- Модель Снежной королевы (статичная) -->
    <a-entity gltf-model="url(SnowQween.glb)"
              position="0 0.5 0"
              scale="0.5 0.5 0.5"
              rotation="-90 0 0">
    </a-entity>
  </a-marker>

  <!-- Фон, чтобы камера не теряла трекинг -->
  <a-plane position="0 0 -2" rotation="-90 0 0" width="4" height="4" color="#777"></a-plane>
  <a-sky color="#ECECEC"></a-sky>
</a-scene>
