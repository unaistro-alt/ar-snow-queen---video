<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen Prototype</title>
    <!-- Подключаем A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- Подключаем AR.js для работы с маркерами -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Сцена с AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- Маркер 1: корона → показываем 3D-модель -->
      <a-marker type="image" url="markers/marker_glb.png">
        <!-- Модель Снежной королевы: scale=0.5 (полметра), поворот подобран под Y Up -->
        <a-entity gltf-model="SnowQween.glb" scale="0.5 0.5 0.5" rotation="-90 0 0"></a-entity>
      </a-marker>

        <!-- Камера обязательна в A-Frame -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Проверка, что HTML отдаётся -->
    <p style="position: fixed; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.6); padding: 8px; z-index: 9999;">Проверка 123</p>
  </body>
</html>
