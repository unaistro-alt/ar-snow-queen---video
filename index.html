<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Snow Queen</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-ar@0.7.1/build/aframe-ar.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false" embedded>
      <a-marker type="pattern" url="preset://hiro">
        <a-entity gltf-model="url(SnowQween.glb)"
                  position="0 0.5 0"
                  scale="0.5 0.5 0.5"
                  rotation="-90 0 0">
        </a-entity>
      </a-marker>

      <a-plane position="0 0 -2" rotation="-90 0 0" width="4" height="4" color="#777"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
